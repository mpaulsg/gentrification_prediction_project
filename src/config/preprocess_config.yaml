input_file: data/raw/factors_socials/poblacio
output_file: data/processed/factors_socials/Poblacio.csv
dictionary_file: data/raw/factors_comercials/Dict_dimensions.csv

# Options: basic/public_works/parks/vehicles/age/studies/income
#          restaurants/teatres/esport/hotels/immigracio/poblacio
processor: poblacio

csv:
  separator: ","
  encoding: cp1252
  null_values:
    - ".."
    - ""

filters:
  start_year: 2015
  end_year: 2018