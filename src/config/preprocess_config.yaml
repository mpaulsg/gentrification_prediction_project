input_file: data/raw/factors_urbanistics/vehicles
output_file: data/processed/master_dataset.csv
dictionary_file: data/raw/factors_comercials/Dict_dimensions.csv
single_preprocessed_dir: data/processed

# Options: basic/public_works/parks/vehicles/age/studies/income
#          restaurants/teatres/esport/hotels/immigracio/poblacio
#          generate_master_dataset
processor: generate_master_dataset

csv:
  separator: ","
  encoding: cp1252
  null_values:
    - ".."
    - ""

filters:
  start_year: 2020
  end_year: 2023